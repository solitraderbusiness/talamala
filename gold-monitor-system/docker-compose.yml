services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - goldmon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - goldmon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRSAPI_KEY: ${BRSAPI_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JBLANKED_API_KEY: ${JBLANKED_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    networks:
      - goldmon-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python -m api.worker.main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRSAPI_KEY: ${BRSAPI_KEY}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - goldmon-net

  signal-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python -m api.signal_aggregator.workers.main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRSAPI_KEY: ${BRSAPI_KEY}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TRADINGVIEW_COOKIE: ${TRADINGVIEW_COOKIE:-}
      SIGNAL_PARSE_MODEL: ${SIGNAL_PARSE_MODEL:-anthropic/claude-sonnet-4}
    volumes:
      - signal-data:/app/data
    networks:
      - goldmon-net

  analysis-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python -m api.analysis.workers.main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      FRED_API_KEY: ${FRED_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ARTICLE_LLM_MODEL: ${ARTICLE_LLM_MODEL:-anthropic/claude-haiku-4.5}
      ARTICLE_DAILY_BUDGET: ${ARTICLE_DAILY_BUDGET:-1.0}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    networks:
      - goldmon-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    environment:
      INTERNAL_API_URL: http://api:8000
    networks:
      - goldmon-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  signal-data:
    driver: local

networks:
  goldmon-net:
    driver: bridge
