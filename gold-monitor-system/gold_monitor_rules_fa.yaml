version: "1.0"
language: "fa"
purpose: "Market monitoring rules for Gold (global + Iran), Coin, and Gold Funds"

severity_levels:
  low:
    description: "خبر/داده با اثر احتمالی کم یا کوتاه‌مدت محدود"
  medium:
    description: "خبر/داده با اثر محتمل و قابل توجه، نیازمند توجه"
  high:
    description: "شوک یا تصمیم رسمی/غافلگیرکننده با احتمال اثر قیمتی بالا"

time_horizons:
  immediate: "دقایق تا چند ساعت"
  short: "چند روز تا چند هفته"
  medium: "چند هفته تا چند ماه"
  long: "چند ماه تا چند سال"

assets:
  global_gold:
    id: "XAUUSD"
    name: "طلای جهانی (اونس / XAUUSD)"
  iran_gold:
    id: "IR_GOLD"
    name: "طلای ایران (۱۸ عیار/مثقال/آبشده)"
  coin:
    id: "IR_COIN"
    name: "سکه (تمام/نیم/ربع/گرمی)"
  gold_funds:
    id: "IR_GOLDFUNDS"
    name: "صندوق‌های سرمایه‌گذاری طلا در بورس ایران (ETF طلا)"

rules:
  - id: "GLOB_GOLD_PRICE"
    section: "global_gold"
    title: "قیمت طلا و فلزات گرانبها (حرکت قیمتی/رکورد/پیش‌بینی)"
    what_it_is: "اخبار عمومی حرکت قیمت طلا، رکوردها، پیش‌بینی‌ها و تحلیل بازار."
    watch_for:
      keywords:
        - "gold"
        - "bullion"
        - "طلا"
      signals: []
    why_important: "اخبار مستقیم قیمت طلا مهم‌ترین سیگنال برای معامله‌گران و سرمایه‌گذاران است."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "price_up => bullish sentiment, price_down => bearish sentiment"
    importance_criteria:
      high_if:
        - "رکورد جدید یا حرکت شدید (بیش از ۲٪ در یک روز)"
        - "پیش‌بینی مهم از نهاد معتبر (Goldman Sachs, JP Morgan, WGC)"
      medium_if:
        - "حرکت عادی بازار با تحلیل"
      low_if:
        - "تکرار اخبار قبلی بدون داده جدید"
    horizon: "immediate"

  - id: "IR_GOLD_COIN_PRICE"
    section: "iran_gold"
    title: "قیمت طلا، سکه و ارز در بازار ایران"
    what_it_is: "اخبار عمومی نوسان قیمت طلا، سکه و ارز در بازار داخلی ایران."
    watch_for:
      keywords:
        - "سکه"
        - "صرافی"
        - "مثقال"
      signals: []
    why_important: "قیمت سکه و طلا در ایران مستقیماً به دلار و اونس جهانی وابسته است و تحت تاثیر عرضه و تقاضای داخلی."
    impact_hypothesis:
      typical_effect:
        - asset: "iran_gold"
          effect: "price_up => bullish"
        - asset: "coin"
          effect: "price_up => bullish"
    importance_criteria:
      high_if:
        - "جهش یا ریزش شدید (بیش از ۳٪ در یک روز)"
        - "رکورد تاریخی شکسته شود"
      medium_if:
        - "نوسان عادی با تحلیل"
      low_if:
        - "تکرار نرخ‌های روز بدون تحلیل"
    horizon: "immediate"

  - id: "GLOB_RATE_DECISION"
    section: "global_gold"
    title: "تصمیم نرخ بهره (افزایش/کاهش/تثبیت)"
    what_it_is: "اعلام رسمی نرخ بهره توسط بانک‌های مرکزی؛ مهم‌تر از همه فدرال رزرو."
    watch_for:
      keywords:
        - "rate hike"
        - "rate cut"
        - "hold rates"
        - "interest rate decision"
        - "FOMC decision"
        - "Fed rate"
        - "ECB rate decision"
        - "BoE rate decision"
        - "BoJ rate decision"
      signals:
        - "افزایش نرخ بهره یا اشاره به افزایش‌های بیشتر"
        - "کاهش نرخ بهره یا اشاره به کاهش‌های آینده"
        - "تغییر مسیر سیاست (تعویق کاهش‌ها / تسریع کاهش‌ها)"
    why_important: "نرخ بهره بالاتر معمولاً فشار نزولی بر طلا ایجاد می‌کند؛ نرخ بهره پایین‌تر معمولاً حمایتی است."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "rate_up => bearish, rate_down => bullish"
    importance_criteria:
      high_if:
        - "تصمیم برخلاف انتظار بازار باشد (Surprise)"
        - "تغییر مسیر سیاست به‌صورت واضح اعلام شود"
      medium_if:
        - "تصمیم مطابق انتظار باشد ولی لحن بیانیه تغییر کند"
      low_if:
        - "خبر تکراری بدون اطلاعات جدید"
    horizon: "immediate"

  - id: "GLOB_QE_QT"
    section: "global_gold"
    title: "سیاست‌های انبساطی/انقباضی (QE/QT)"
    what_it_is: "تغییر در تزریق یا جمع‌آوری نقدینگی و اندازه ترازنامه بانک مرکزی."
    watch_for:
      keywords:
        - "quantitative easing"
        - "QE"
        - "asset purchases"
        - "balance sheet expansion"
        - "quantitative tightening"
        - "QT"
        - "balance sheet reduction"
      signals:
        - "اعلام برنامه جدید خرید دارایی (QE)"
        - "کاهش سرعت QT یا توقف QT"
        - "تشدید QT یا افزایش سرعت کاهش ترازنامه"
    why_important: "QE معمولاً انتظارات تورمی/تضعیف پول را بالا می‌برد و برای طلا حمایتی است؛ QT برعکس."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "QE => bullish, QT => bearish"
    importance_criteria:
      high_if:
        - "شروع QE جدید یا تغییر بزرگ در ترازنامه اعلام شود"
      medium_if:
        - "تنها تغییر سرعت QT/QE گزارش شود"
    horizon: "short"

  - id: "GLOB_FED_COMM"
    section: "global_gold"
    title: "سخنرانی‌ها/بیانیه‌ها (Powell/Fed/ECB/BoE/BoJ)"
    what_it_is: "راهنمایی کلامی (Forward guidance) که انتظارات نرخ بهره و دلار را تغییر می‌دهد."
    watch_for:
      keywords:
        - "Powell"
        - "Fed chair"
        - "Fed minutes"
        - "forward guidance"
        - "hawkish"
        - "dovish"
        - "Lagarde"
        - "Bailey"
        - "Ueda"
      signals:
        - "تغییر لحن از سختگیرانه به نرم یا برعکس"
        - "اشاره به نگرانی رکود/بحران بانکی"
    why_important: "لحن سیاست‌گذار می‌تواند حتی بدون تغییر نرخ بهره، بازار را جابه‌جا کند."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "dovish => bullish, hawkish => bearish"
    importance_criteria:
      high_if:
        - "جمله/اشاره کلیدی جدید مسیر آینده نرخ بهره را تغییر دهد"
      medium_if:
        - "تکرار مواضع قبلی با جزئیات بیشتر"
    horizon: "immediate"

  - id: "GLOB_US_YIELDS"
    section: "global_gold"
    title: "بازده اوراق خزانه‌داری آمریکا (2Y/10Y/Real Yield)"
    what_it_is: "نرخ بازده اوراق که با هزینه فرصت نگهداری طلا مرتبط است."
    watch_for:
      keywords:
        - "10-year yield"
        - "2-year yield"
        - "Treasury yields"
        - "real yields"
        - "TIPS"
      signals:
        - "جهش یا سقوط ناگهانی بازده‌ها"
        - "اخبار بحران بدهی/حراج اوراق بزرگ"
    why_important: "بالا رفتن بازده‌ها معمولاً منفی برای طلاست؛ افت بازده‌ها حمایتی است."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "yields_up => bearish, yields_down => bullish"
    importance_criteria:
      high_if:
        - "حرکت شدید (مثلاً جهش/سقوط غیرعادی در یک روز)"
    horizon: "immediate"

  - id: "GLOB_DOLLAR_DXY"
    section: "global_gold"
    title: "شاخص دلار (DXY) و اخبار تقویت/تضعیف دلار"
    what_it_is: "قدرت دلار در برابر سبد ارزها؛ رابطه معکوس رایج با طلا."
    watch_for:
      keywords:
        - "DXY"
        - "dollar index"
        - "USD strengthens"
        - "USD weakens"
      signals:
        - "جهش/سقوط شدید DXY"
        - "دلایل بنیادی تقویت دلار (داده قوی، سیاست سختگیرانه)"
    why_important: "دلار قوی معمولاً طلا را تحت فشار می‌گذارد."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "dollar_up => bearish, dollar_down => bullish"
    importance_criteria:
      high_if:
        - "شکست سطوح کلیدی یا حرکت بسیار سریع"
    horizon: "immediate"

  - id: "GLOB_US_MACRO_DATA"
    section: "global_gold"
    title: "داده‌های کلان آمریکا (CPI/PCE/NFP/PMI/…)"
    what_it_is: "گزارش‌هایی که انتظارات نرخ بهره/دلار را تغییر می‌دهند."
    watch_for:
      keywords:
        - "CPI"
        - "core CPI"
        - "PCE"
        - "core PCE"
        - "PPI"
        - "NFP"
        - "unemployment rate"
        - "wage growth"
        - "Retail Sales"
        - "GDP"
        - "PMI"
        - "ISM"
        - "JOLTS"
      signals:
        - "عدد «بالاتر از انتظار» یا «پایین‌تر از انتظار»"
        - "بازنگری‌های بزرگ در داده‌ها"
    why_important: "غافلگیری داده‌ها می‌تواند مسیر نرخ بهره و دلار را تغییر دهد."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "hot_data => bearish (rate hike fear), cool_data => bullish"
    importance_criteria:
      high_if:
        - "Surprise بزرگ باشد یا بازار واکنش شدید نشان دهد"
      medium_if:
        - "Surprise کوچک ولی جهت‌دار باشد"
    horizon: "immediate"

  - id: "GLOB_GEOPOL_RISK"
    section: "global_gold"
    title: "ژئوپلیتیک (جنگ/تشدید/حملات/کودتا/ترور بزرگ)"
    what_it_is: "رویدادهای امنیتی-سیاسی که ریسک سیستماتیک و تقاضای دارایی امن را بالا می‌برد."
    watch_for:
      keywords:
        - "war"
        - "escalation"
        - "strike"
        - "missile"
        - "invasion"
        - "coup"
        - "terror attack"
        - "sanctions"
        - "state of emergency"
      signals:
        - "شروع یا گسترش جنگ"
        - "حمله به زیرساخت انرژی/کشتیرانی"
        - "تحریم‌های بزرگ و ناگهانی"
    why_important: "افزایش ریسک جهانی غالباً به نفع طلاست."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "risk_up => bullish"
    importance_criteria:
      high_if:
        - "تشدید رسمی/گسترش درگیری یا تحریم بزرگ"
    horizon: "immediate"

  - id: "GLOB_MINING_SUPPLY"
    section: "global_gold"
    title: "عرضه معدن (تولید/هزینه استخراج/عیار)"
    what_it_is: "عوامل سمت عرضه که بیشتر اثر میان‌مدت/بلندمدت دارند."
    watch_for:
      keywords:
        - "gold mine production"
        - "output cut"
        - "mine shutdown"
        - "strike"
        - "ore grade"
        - "all-in sustaining costs"
      signals:
        - "افت تولید معنی‌دار یا تعطیلی معدن بزرگ"
        - "گزارش افت عیار یا رشد هزینه استخراج"
    why_important: "محدودیت عرضه و افزایش هزینه می‌تواند از قیمت حمایت کند."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "supply_down => bullish"
    importance_criteria:
      high_if:
        - "تعطیلی/افت تولید در مقیاس بزرگ گزارش شود"
      medium_if:
        - "روند هزینه‌ها/عیار در گزارش‌های معتبر تایید شود"
    horizon: "medium"

  - id: "GLOB_CB_GOLD_RESERVES"
    section: "global_gold"
    title: "خرید/فروش طلا توسط بانک‌های مرکزی"
    what_it_is: "تقاضای نهادی بزرگ و سیگنال تنوع ذخایر."
    watch_for:
      keywords:
        - "central bank gold reserves"
        - "added to gold reserves"
        - "sold gold reserves"
        - "WGC"
        - "World Gold Council"
        - "PBoC gold"
      signals:
        - "خرید رکوردی/بزرگ توسط چین/روسیه/هند/ترکیه و…"
        - "اعلام فروش یا برنامه فروش ذخایر"
    why_important: "خریدهای بزرگ می‌تواند حمایت ساختاری ایجاد کند."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "buying => bullish, selling => bearish"
    importance_criteria:
      high_if:
        - "خرید/فروش بزرگ یا تغییر روند چندماهه"
    horizon: "short"

  - id: "GLOB_ASIA_PHYSICAL_DEMAND"
    section: "global_gold"
    title: "تقاضای فیزیکی چین/هند (فصلی/واردات/تعرفه/الگوی مصرف)"
    what_it_is: "تقاضای جواهرات و سکه، تحت تاثیر فصل‌ها و سیاست‌های تجاری."
    watch_for:
      keywords:
        - "India wedding season"
        - "Chinese New Year"
        - "gold imports"
        - "import duty"
        - "tariff"
        - "jewelry demand"
      signals:
        - "افزایش غیرعادی تقاضای فصلی"
        - "کاهش/افزایش تعرفه واردات طلا"
        - "آمار واردات بسیار بالاتر/پایین‌تر از انتظار"
    why_important: "این دو کشور سهم بالایی در تقاضای فیزیکی دارند."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "demand_up => bullish"
    importance_criteria:
      high_if:
        - "تغییر سیاست تعرفه‌ای یا واردات شوک‌آور"
      medium_if:
        - "گزارش فصلی قوی/ضعیف"
    horizon: "short"

  - id: "GLOB_CRYPTO_SHOCKS"
    section: "global_gold"
    title: "شوک‌های بزرگ بازار رمزارز (ریزش/جهش شدید)"
    what_it_is: "جابه‌جایی توجه و نقدینگی بین دارایی‌های جایگزین."
    watch_for:
      keywords:
        - "Bitcoin crash"
        - "crypto liquidation"
        - "exchange hack"
        - "ETF inflows crypto"
        - "Bitcoin surge"
      signals:
        - "ریزش شدید چندروزه یا لیکوییدیشن بزرگ"
        - "جهش پرشتاب و موج ریسک‌پذیری"
    why_important: "ترس کریپتو می‌تواند پول را به دارایی امن منتقل کند."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "crypto_crash => bullish (safe haven flow)"
    importance_criteria:
      high_if:
        - "ورشکستگی/هک بزرگ/ریزش بسیار شدید"
    horizon: "immediate"

  - id: "GLOB_EQUITY_RISK_OFF"
    section: "global_gold"
    title: "ریزش شدید بورس‌های جهانی / بحران بانکی"
    what_it_is: "افزایش ریسک‌گریزی و تقاضا برای دارایی امن."
    watch_for:
      keywords:
        - "stock market selloff"
        - "bank crisis"
        - "credit crunch"
        - "recession fears"
        - "VIX spike"
      signals:
        - "ریزش شدید شاخص‌ها یا جهش VIX"
        - "خبر ورشکستگی بانک/نهاد بزرگ"
    why_important: "Risk-off معمولاً به نفع طلاست."
    impact_hypothesis:
      typical_effect:
        - asset: "global_gold"
          effect: "risk_off => bullish"
    importance_criteria:
      high_if:
        - "شوک سیستماتیک/بحران اعتباری"
    horizon: "immediate"

  - id: "IR_FX_USD"
    section: "iran_gold"
    title: "نرخ دلار آزاد و شکاف نرخ‌ها (آزاد/نیما/مرکز مبادله)"
    what_it_is: "مهم‌ترین محرک ریالی طلا در ایران."
    watch_for:
      keywords:
        - "دلار آزاد"
        - "نرخ دلار"
        - "بازار ارز"
        - "نیما"
        - "مرکز مبادله"
        - "درهم"
      signals:
        - "جهش/ریزش ناگهانی نرخ ارز"
        - "تغییر معنادار شکاف نرخ‌ها"
    why_important: "قیمت طلا در ایران تقریباً اونس×دلار است؛ تغییر دلار سریعاً اثر می‌گذارد."
    impact_hypothesis:
      typical_effect:
        - asset: "iran_gold"
          effect: "dollar_up => bullish for iran_gold"
        - asset: "coin"
          effect: "dollar_up => bullish"
    importance_criteria:
      high_if:
        - "حرکت شدید یا خبر سیاستی مستقیم"
    horizon: "immediate"

  - id: "IR_GOV_FX_POLICY"
    section: "iran_gold"
    title: "سیاست‌های ارزی دولت و بانک مرکزی"
    what_it_is: "قواعد تخصیص/کنترل ارز و مداخلات ارزی."
    watch_for:
      keywords:
        - "سیاست ارزی"
        - "پیمان ارزی"
        - "تخصیص ارز"
        - "تزریق ارز"
        - "محدودیت صرافی"
      signals:
        - "بخشنامه جدید ارزی"
        - "تزریق/محدودیت بزرگ در بازار ارز"
    why_important: "می‌تواند عرضه/تقاضای ارز و انتظارات را جابه‌جا کند."
    impact_hypothesis:
      typical_effect:
        - asset: "iran_gold"
          effect: "policy_restrictive => uncertain, policy_loose => bullish"
    importance_criteria:
      high_if:
        - "قانون/بخشنامه جدید با اثر فوری"
    horizon: "short"

  - id: "IR_RESERVES_SANCTIONS"
    section: "iran_gold"
    title: "ذخایر ارزی، آزادسازی منابع، تحریم‌های ارزی"
    what_it_is: "توان دسترسی به ارز و فشار/آزادسازی از بیرون."
    watch_for:
      keywords:
        - "آزادسازی منابع"
        - "پول‌های بلوکه"
        - "تحریم ارزی"
        - "تحریم بانکی"
        - "سوئیفت"
      signals:
        - "آزادسازی یا مسدودسازی منابع"
        - "تحریم جدید علیه بانک‌ها/نهادهای ارزی"
    why_important: "مستقیماً دلار را تکان می‌دهد و به طلا منتقل می‌شود."
    impact_hypothesis:
      typical_effect:
        - asset: "iran_gold"
          effect: "sanctions_up => bullish, release => bearish"
    importance_criteria:
      high_if:
        - "تحریم جدید بزرگ یا آزادسازی بزرگ منابع"
    horizon: "immediate"

  - id: "IR_MACRO_INFLATION_LIQ"
